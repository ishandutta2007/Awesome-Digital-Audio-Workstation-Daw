<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="45%" stop-color="#11162b" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.04); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulseEq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -720; }
      }
      @keyframes glowOrb {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }

      .floating-orb-1 {
        animation: glowOrb 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .floating-orb-2 {
        animation: glowOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 300px;
      }
      .eq-bar {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: pulseEq 1.8s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 24 12;
        animation: waveScroll 25s linear infinite;
      }
      .pill-badge {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="18" fill="url(#gridPattern)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="floating-orb-1" cx="220" cy="110" r="140" fill="#8b5cf6" opacity="0.3" filter="url(#glow)" />
  <circle class="floating-orb-2" cx="1020" cy="280" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  <circle cx="650" cy="380" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Sound Wave Curves in Lower Background -->
  <path class="wave-line" d="M 0 350 Q 150 280, 300 350 T 600 350 T 900 350 T 1200 350" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="2" />
  <path class="wave-line" d="M 0 365 Q 150 310, 300 365 T 600 365 T 900 365 T 1200 365" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="3" />

  <!-- Decorative Modern EQ Spectrum Bars Behind Card/Foreground -->
  <g transform="translate(430, 350)">
    <rect class="eq-bar" x="0" y="-80" width="8" height="80" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.1s; animation-duration: 1.4s;" />
    <rect class="eq-bar" x="14" y="-110" width="8" height="110" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.3s; animation-duration: 1.7s;" />
    <rect class="eq-bar" x="28" y="-60" width="8" height="60" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.6s; animation-duration: 1.2s;" />
    <rect class="eq-bar" x="42" y="-130" width="8" height="130" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.2s; animation-duration: 2.0s;" />
    <rect class="eq-bar" x="56" y="-95" width="8" height="95" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.5s; animation-duration: 1.5s;" />
    <rect class="eq-bar" x="70" y="-140" width="8" height="140" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.8s; animation-duration: 1.9s;" />
    <rect class="eq-bar" x="84" y="-75" width="8" height="75" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.4s; animation-duration: 1.3s;" />
    <rect class="eq-bar" x="98" y="-120" width="8" height="120" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.7s; animation-duration: 1.6s;" />
    <rect class="eq-bar" x="112" y="-85" width="8" height="85" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.2s; animation-duration: 1.8s;" />
    <rect class="eq-bar" x="126" y="-50" width="8" height="50" rx="4" fill="url(#accentGrad)" style="animation-delay: 0.9s; animation-duration: 1.1s;" />
  </g>

  <!-- Foreground Main Container Frame -->
  <g transform="translate(60, 42)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#06b6d4" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="1.5">AWESOME COLLECTION</text>

    <!-- Headline Title (Guaranteed Foreground & Crisp) -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Digital Audio Workstations
    </text>
    <text x="730" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">
      (DAW)
    </text>

    <!-- Subtitle -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Curated Commercial SaaS Platforms &amp; Open-Source Music Production Suites
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g class="pill-badge" transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🎹 Music Production</text>
      </g>

      <!-- Pill 2 -->
      <g class="pill-badge" transform="translate(196, 0)">
        <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🎙️ Audio Recording</text>
      </g>

      <!-- Pill 3 -->
      <g class="pill-badge" transform="translate(392, 0)">
        <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🎚️ Mixing &amp; Mastering</text>
      </g>

      <!-- Pill 4 -->
      <g class="pill-badge" transform="translate(588, 0)">
        <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ Open-Source &amp; Free</text>
      </g>

      <!-- Pill 5 -->
      <g class="pill-badge" transform="translate(784, 0)">
        <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">💰 Pricing &amp; Free Tiers</text>
      </g>
    </g>

    <!-- Live Metrics / Metadata Row -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <g transform="translate(0, 24)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">CATEGORIES</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">SaaS &amp; Open-Source</text>
      </g>

      <g transform="translate(240, 24)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">POPULAR FORMATS</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#c084fc">VST3 • AU • LV2 • CLAP</text>
      </g>

      <g transform="translate(520, 24)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">CURATED TOOLS</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f472b6">25+ Top DAWs &amp; Suites</text>
      </g>

      <g transform="translate(800, 24)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">UPDATED</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#4ade80">Continuous 2026</text>
      </g>
    </g>
  </g>
</svg>
